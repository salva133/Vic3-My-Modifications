l_german:

# Military Regency
  gov_regency_mym_military: "Militärregentschaft"
  gov_regency_mym_military_desc: "Eine [concept_government_type], bei der der Thron verwaist ist und die Macht an den Anführer der $ig_variant_armed_forces$ gefallen ist, der als [Concept('concept_ruler','$RULER_TITLE_MYM_LORD_COMMANDER$')] anstelle eines Monarchen regiert, der den Thron nicht besteigen kann. Das Militär ist zugleich Wächter und Verwalter der Krone und verleiht dem Regime seine Disziplin und seine Schwerter.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

# Noble Regency
  gov_regency_mym_noble: "Adelsregentschaft"
  gov_regency_mym_noble_desc: "Eine [concept_government_type], bei der der Thron verwaist ist und die Macht an den vornehmsten Magnaten des Reiches gefallen ist, der als [Concept('concept_ruler','$RULER_TITLE_MYM_LORD_REGENT$')] anstelle eines Monarchen regiert, der den Thron nicht besteigen kann. Die Aristokratie verleiht dem Regime die Legitimität uralter Titel und das Gewicht ihrer Güter.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

# Swiss Confederation flavour government types
  gov_swiss_diet: "Die Tagsatzung"
  gov_swiss_diet_desc: "Ein loser Bund souveräner Kantone. Der vorsitzende Kanton – der #italic Vorort#! – wechselt jährlich zwischen Zürich, Bern und Luzern, und an seiner Spitze steht der [Concept('concept_ruler','$RULER_TITLE_LANDAMMANN$')] der Schweiz, eher Sprecher der versammelten Stände als Staatsoberhaupt.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

  gov_swiss_federation: "Schweizerische Eidgenossenschaft"
  gov_swiss_federation_desc: "Ein Bundesstaat unter der Verfassung von 1848. Die Exekutivgewalt liegt beim siebenköpfigen #italic Bundesrat#!, dessen Vorsitz jährlich wechselt; der [Concept('concept_ruler','$RULER_TITLE_FEDERAL_PRESIDENT$')] ist Primus inter Pares, nicht Staatsoberhaupt.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

  gov_swiss_federation_dictator: "Vollmachtenregime"
  gov_swiss_federation_dictator_desc: "Der Bundesrat regiert per Notverordnung kraft #italic Vollmachten#!, die außerhalb des ordentlichen Verfassungsweges erteilt wurden. Parlament und Volk werden übergangen; der [Concept('concept_ruler','$RULER_TITLE_PLENIPOTENTIARY$')] regiert die Eidgenossenschaft per Dekret.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

# Vice-Monarchies
  gov_mym_viceroyalty: "Vizekönigreich"
  gov_mym_viceroyalty_desc: "Eine [concept_government_type], bei der ein Königreich als [concept_puppet] einer fremden Macht regiert wird. Sein [Concept('concept_ruler','$RULER_TITLE_MYM_VICEROY$')] oder seine [Concept('concept_ruler','$RULER_TITLE_MYM_VICEREINE$')] trägt die Insignien des Königtums, herrscht jedoch im Namen – und nach dem Belieben – des [concept_overlord]s.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

  gov_mym_vice_duchy: "Vizeherzogtum"
  gov_mym_vice_duchy_desc: "Eine [concept_government_type], bei der ein Herzogtum als [concept_puppet] einer fremden Macht regiert wird. Sein [Concept('concept_ruler','$RULER_TITLE_MYM_VICE_DUKE$')] oder seine [Concept('concept_ruler','$RULER_TITLE_MYM_VICE_DUCHESS$')] hält daheim Hof, doch das herzogliche Siegel prangt auf keinem Dokument, das der [concept_overlord] nicht gegenzeichnen würde.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

  gov_mym_vice_principality: "Vizefürstentum"
  gov_mym_vice_principality_desc: "Eine [concept_government_type], bei der ein Fürstentum als [concept_puppet] einer fremden Macht regiert wird. Sein [Concept('concept_ruler','$RULER_TITLE_MYM_VICE_PRINCE$')] oder seine [Concept('concept_ruler','$RULER_TITLE_MYM_VICE_PRINCESS$')] herrscht kraft Erbrecht, doch jeder Staatsakt beugt sich dem Willen des [concept_overlord]s.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

  gov_mym_vice_regency: "Vizeregentschaft"
  gov_mym_vice_regency_desc: "Eine [concept_government_type], bei der der Thron einer Monarchie verwaist ist, die eine [concept_puppet] ist. Ein [Concept('concept_ruler','$RULER_TITLE_MYM_VICE_REGENT$')] führt die Regierung im Namen eines Monarchen, der den Thron nicht besteigen kann – und über ihm im Namen des [concept_overlord]s, nach dessen Belieben die Regentschaft fortbestehen darf.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

# Patrician Republic — presidential/parliamentary republic governed under the Oligarchy distribution-of-power law
# (overrides vanilla "Presidential Oligarchy" and "Oligarchy")
  gov_presidential_oligarchy: "Patrizierrepublik"
  gov_presidential_oligarchy_desc: "Eine [concept_government_type], bei der das [concept_country] von seinem [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$en')] im Auftrag eines kleinen Patriziats begüterter Honoratioren regiert wird. Ein allgemeines Wahlrecht gibt es nicht; Ämter und Einfluss wechseln nur zwischen denselben wenigen großen Familien und ihrer Klientel.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

  gov_parliamentary_oligarchy: "Patrizierrepublik"
  gov_parliamentary_oligarchy_desc: "Eine [concept_government_type], bei der das [concept_country] von einem [Concept('concept_ruler','$RULER_TITLE_CHANCELLOR$')] regiert wird, der einer Versammlung aus einem kleinen Patriziat begüterter Honoratioren verantwortlich ist. Ein allgemeines Wahlrecht gibt es nicht; Ämter und Einfluss wechseln nur zwischen denselben wenigen großen Familien und ihrer Klientel.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

