l_german:

### DEBUG MENU
  mym_debug.pre.tt: "#blue My Modifications#!"

# .1 Main menu
  mym_debug.1.tt: "$mym_debug.pre.tt$: Debug-Menü"
  mym_debug.1.dd: "Zugriff auf verschiedene Debug-Werkzeuge und Untermenüs zum schnellen Testen und Verändern des Spielzustands. Jede Option öffnet eine spezielle Debug-Funktion."
  mym_debug.1.ff: "#lore Hinter jedem System verbirgt sich eine geheime Schalttafel – wo die Regeln der Welt mit einer einzigen Entscheidung neu geschrieben werden."
  mym_debug.1.aa: "Schließen"
  mym_debug.1.a: "$mym_debug.2.tt$\n$mym_debug.2.dd$"
  mym_debug.1.b: "$mym_debug.3.tt$\n$mym_debug.3.dd$"
  mym_debug.1.c: "$mym_debug.4.tt$\n$mym_debug.4.dd$"
  mym_debug.1.d: "$mym_debug.5.tt$\n$mym_debug.5.dd$"
  mym_debug.1.e: "$mym_debug.6.tt$\n$mym_debug.6.dd$"
  mym_debug.1.f: "Heim ins Reich! – Annektiert jedes europäische Land, dessen Primärkultur Norddeutsch ist."
  mym_debug.1.g: "Stopft den Boden voll! – Verteilt je 100 Stufen Kautschukplantage, Ölbohrturm und Schwefelmine auf zufällige eigene Staaten. Stufen über der Obergrenze bleiben bestehen, bis sie abgerissen werden, danach sind sie weg."
  mym_debug.1.h: "$mym_debug.7.tt$\n$mym_debug.7.dd$"

# .2 Leader Ideology Changer
  mym_debug.2.tt: "$mym_debug.pre.tt$ Ideologiewechsler für Anführer"
  mym_debug.2.dd: "Ideologische Optionen bereitstellen"
  mym_debug.2.ff: "#lore Wendet nur Ideologien an, die im Spiel existieren.\nKann eine Ideologie nicht angewendet werden, existiert sie im aktuellen Spiel nicht."
  mym_debug.2.aa: "Zurück"
  mym_debug.2.a: "Gemeinsam werden wir Ordnung und nationalen Ruhm wiederherstellen!"
  mym_debug.2.b: "Genossen, erhebt euch!"
  mym_debug.2.c: "Sprenge deine Ketten, Freund!"
  mym_debug.2.d: "Umarme deine Freiheit!"
  mym_debug.2.e: "Traue niemandem!"
  mym_debug.2.f: "Die $concept_ideology$ jedes [Concept('concept_politician','Politikers')] durcheinanderwürfeln"
  mym_debug.2.g: "Namen der Geheimpolizei-IG dynamisch setzen (#green Global#!)"

# .3 Game Breaker
  mym_debug.3.tt: "$mym_debug.pre.tt$ Spielbrecher"
  mym_debug.3.dd: "Debug-Optionen bereitstellen"
  mym_debug.3.ff: "#lore Hier gibt es spielbrechendes Zeug, viel Spaß – #red wenn du dich traust!#!"
  mym_debug.3.aa: "Zurück"
  mym_debug.3.a: "Alle Länder erhalten die Technologie der 5. Ära"
  mym_debug.3.b: "Alle Länder werden unabhängig"
  mym_debug.3.d: "Gib mir die ganze Technik, du Dreck!"
  mym_debug.3.e: "Die untersten zwei Prozent säubern"
  mym_debug.3.e_tt: "Erfasst jede #bold arbeitslose#! Pop, die sowohl im untersten 2-%-Band der [concept_literacy] als auch im untersten 2-%-Band des [concept_sol]s der Bevölkerung liegt – und tötet sie. Die beiden Bänder überschneiden sich, daher sterben höchstens 2 % der Bevölkerung. Die Todesfälle werden pro Staat und Kultur verteilt, sodass beschäftigte Pops derselben Kultur etwas von der Salve abbekommen können. Nur einmal alle #bold 50 Jahre#! verfügbar."

# .4 Character Spawn
  mym_debug.4.tt: "$mym_debug.pre.tt$ Charaktererschaffung"
  mym_debug.4.dd: "Wähle deinen Agitator"
  mym_debug.4.ff: "#lore Die Auswahl einer Option erschafft einen Agitator mit der entsprechenden Ideologie. Existiert ein solcher Agitator bereits, wird er zum Herrscher gemacht."
  mym_debug.4.aa: "Zurück"
  mym_debug.4.b: "Nation und Blut über alles!!"
  mym_debug.4.c: "Reißt die Unterdrücker nieder!"
  mym_debug.4.d: "Keine Herren, keine Knechte!"
  mym_debug.4.e: "Stärke und Tradition werden siegen!"
  mym_debug.4.f: "Vernunft und Fortschritt über alles!"
  mym_debug.4.g: "Beschleunigt in die Zukunft!"
  mym_debug.4.h: "Absolute Macht korrumpiert absolut"

