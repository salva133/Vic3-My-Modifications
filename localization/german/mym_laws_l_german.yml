l_german:
  law_full_collectivization: "Vollständige Kollektivierung"
  law_full_collectivization_desc: "$law_full_collectivization$ zielt darauf ab, Eigentum und Kontrolle aller Betriebe unmittelbar in die Hände der örtlichen Belegschaft zu legen. Dieses System schafft privates wie staatliches Eigentum an der Industrie ab und überlässt sämtliche Produktionsmittel den Arbeitern, die sie gemeinsam betreiben. Durch die Beseitigung hierarchischer Strukturen und zentraler Autoritäten fördert die Vollständige Kollektivierung Gleichheit, lokale Selbstverwaltung und genossenschaftliche Entscheidungsfindung und stellt sicher, dass alle Gewinne und Erträge unter den Arbeitern selbst verteilt werden."
