# .6 Journal Entry Spawner
  mym_debug.6.tt: "$mym_debug.pre.tt$ Journaleintrags-Erzeuger"
  mym_debug.6.dd: "Fügt einen beliebigen Journaleintrag von My Modifications zwangsweise hinzu und überspringt dabei dessen übliche Voraussetzungen."
  mym_debug.6.ff: "#lore Das Journal schreibt sich heute Nacht von selbst. Keine Fragen.#!"
  mym_debug.6.aa: "Zurück"
