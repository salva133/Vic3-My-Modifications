  RULER_TITLE_MYM_LORD_COMMANDER: "Lordkommandant"
  RULER_TITLE_MYM_LORD_REGENT: "Lordregent"
  RULER_TITLE_LANDAMMANN: "Landammann"
  RULER_TITLE_FEDERAL_PRESIDENT: "Bundespräsident"
  RULER_TITLE_PLENIPOTENTIARY: "Vollmachtsvorsitzender"
  RULER_TITLE_MYM_VICEROY: "Vizekönig"
  RULER_TITLE_MYM_VICEREINE: "Vizekönigin"
  RULER_TITLE_MYM_VICE_DUKE: "Vizeherzog"
  RULER_TITLE_MYM_VICE_DUCHESS: "Vizeherzogin"
  RULER_TITLE_MYM_VICE_PRINCE: "Vizefürst"
  RULER_TITLE_MYM_VICE_PRINCESS: "Vizefürstin"
  RULER_TITLE_MYM_VICE_REGENT: "Vizeregent"
